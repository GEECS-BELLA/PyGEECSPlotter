# Minimal conda environment for PyGEECSPlotter.
#   conda env create -f environment.yml
#   conda activate pygeecsplotter
name: pygeecsplotter
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - scipy
  - pandas
  - matplotlib
  - scikit-learn
  - opencv
  - imageio
  - pypng
  - tqdm
  - ipywidgets
  - ipykernel
  - watchdog
  - filelock
  - pip
  - pip:
      - -e .
